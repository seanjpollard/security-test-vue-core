packages:
  - 'packages/*'
  - 'packages-private/*'

catalog:
  '@babel/parser': ^7.29.3
  '@babel/types': ^7.29.0
  'entities': '^7.0.1'
  'estree-walker': ^2.0.2
  'magic-string': ^0.30.21
  'source-map-js': ^1.2.1
  'vite': ^8.0.10
  '@vitejs/plugin-vue': ^6.0.6

allowBuilds:
  '@swc/core': true
  'esbuild': true
  'puppeteer': true
  'simple-git-hooks': true
  'unrs-resolver': true

dedupePeers: true

peerDependencyRules:
  allowedVersions:
    'typescript-eslint>eslint': '^9.0.0'
    '@typescript-eslint/eslint-plugin>eslint': '^9.0.0'
    '@typescript-eslint/parser>eslint': '^9.0.0'
    '@typescript-eslint/type-utils>eslint': '^9.0.0'
    '@typescript-eslint/utils>eslint': '^9.0.0'
overrides:
  'basic-ftp@5.3.1': '6.2.4' # lockwright: GHSA-5pm8-86m8-9m6r, GHSA-5rq4-664w-9x2c, GHSA-6v7q-wjvx-w8wg, GHSA-c475-qrg2-pj4r, GHSA-r4jh-29pc-gfqr, GHSA-rp42-5vxx-qpwr, GHSA-rpmf-866q-6p89
