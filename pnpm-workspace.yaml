packages:
  - 'packages/*'
  - 'packages-private/*'

catalog:
  '@babel/parser': ^7.29.12
  '@babel/types': ^7.29.11
  'entities': '^7.0.1'
  'estree-walker': ^2.0.2
  'magic-string': ^0.30.21
  'source-map-js': ^1.2.2
  'vite': ^8.3.5
  '@vitejs/plugin-vue': ^6.0.10

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  'esbuild': true
  'puppeteer': true
  'simple-git-hooks': true
  'unrs-resolver': true

dedupePeers: true

peerDependencyRules:
  allowedVersions:
    'typescript-eslint>eslint': '^9.0.0'
    '@typescript-eslint/eslint-plugin>eslint': '^9.0.0'
    '@typescript-eslint/parser>eslint': '^9.0.0'
    '@typescript-eslint/type-utils>eslint': '^9.0.0'
    '@typescript-eslint/utils>eslint': '^9.0.0'

minimumReleaseAge: 1440

trustPolicy: no-downgrade
minimumReleaseAgeExclude:
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: minimatch@11.0.1
  - minimatch@11.0.1
overrides:
  '@vitest/mocker@4.1.11': '4.1.12' # lockwright: GHSA-qxg6-89mg-rqv8, GHSA-xp26-3454-mjgp
  'compression@1.8.1': '1.8.2' # lockwright: GHSA-vc2v-76pw-4v95
